name: Debug Build

on:
  workflow_dispatch:

jobs:
  debug-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Install deps
        run: npm install --registry=https://registry.npmjs.org

      - name: Verify Electron binary
        run: |
          if (Test-Path node_modules\electron\dist\electron.exe) {
            "✅ electron.exe exists"
          } else {
            "❌ electron.exe NOT FOUND - attempting install.js"
            node node_modules\electron\install.js
          }

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build

      - name: Package
        run: npx electron-builder --win --publish never

      - name: List dist contents
        shell: pwsh
        run: |
          Get-ChildItem dist -Recurse | Format-Table FullName, Length

  debug-linux:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Install deps
        run: npm install --registry=https://registry.npmjs.org

      - name: Verify Electron binary
        run: |
          if [ -f node_modules/electron/dist/electron ]; then
            echo "✅ electron binary exists"
          else
            echo "Installing electron..."
            node node_modules/electron/install.js
          fi

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build

      - name: Package
        run: npx electron-builder --linux AppImage --publish never

      - name: List dist contents
        run: ls -laR dist/
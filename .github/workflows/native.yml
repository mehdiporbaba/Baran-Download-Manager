name: Native Windows build

on:
  push:
    branches: [main, codex/native-webview2, codex/connected-downloads, codex/browser-install-onboarding, codex/release-v2.1.1, codex/firefox-and-upstream-fixes]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  native:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: node scripts/release-notes.cjs --check
      - run: npm ci
      - run: node scripts/readme.cjs
      - run: npm run typecheck
      - run: npm test
      - name: Build native Windows app and installer
        run: npm run build:native
      - name: Test native downloads, migration, proxies, inbox and local torrent
        run: npm run test:native
      - name: Test connected services, pairing, provider contracts and VPN binding
        run: npm run test:connected
      - name: Test advanced provider, media routing and tool installation boundaries
        run: npm run test:advanced
      - name: Package browser extensions
        shell: pwsh
        run: |
          ./scripts/package-extension.ps1
          Copy-Item browser-extension/signed/Baran-Firefox-Extension-1.0.2-signed.xpi dist/
          node scripts/prepare-chrome-store.cjs
          Compress-Archive -Path dist/chrome-store-submission/* -DestinationPath dist/Baran-Chrome-Store-Submission-1.0.2.zip -Force
      - name: Verify runtime and create checksums
        shell: pwsh
        run: |
          if (Test-Path dist/native/resources/app.asar) { throw 'Electron archive must not be in native runtime' }
          if (Test-Path dist/native/node.exe) { throw 'Node must not be in native runtime' }
          $names = @('Baran-Download-Manager-Native-Setup-2.1.1-x64.exe', 'Baran-Download-Manager-Native-Portable-2.1.1-x64.zip', 'Baran-Browser-Extension-1.0.2.zip', 'Baran-Firefox-Extension-1.0.2-signed.xpi', 'Baran-Chrome-Store-Submission-1.0.2.zip')
          $lines = foreach ($name in $names) {
            $file = Get-Item -LiteralPath "dist/$name"
            if ($file.Length -eq 0) { throw "Empty file: $name" }
            if ($name -match 'Native-Setup|Native-Portable' -and $file.Length -gt 30MB) { throw 'Native app package exceeds 30 MB' }
            "$((Get-FileHash -LiteralPath $file.FullName -Algorithm SHA256).Hash.ToLowerInvariant())  $name"
          }
          $lines | Set-Content dist/SHA256SUMS-Native-2.1.1.txt -Encoding utf8NoBOM
      - uses: actions/upload-artifact@v4
        with:
          name: baran-native-2.1.1
          path: |
            dist/Baran-Download-Manager-Native-Setup-2.1.1-x64.exe
            dist/Baran-Download-Manager-Native-Portable-2.1.1-x64.zip
            dist/Baran-Browser-Extension-1.0.2.zip
            dist/Baran-Firefox-Extension-1.0.2-signed.xpi
            dist/Baran-Chrome-Store-Submission-1.0.2.zip
            dist/SHA256SUMS-Native-2.1.1.txt
          if-no-files-found: error

  publish:
    needs: native
    if: github.event_name == 'push' && github.ref == 'refs/heads/codex/release-v2.1.1'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: baran-native-2.1.1
          path: artifacts
      - uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const repo = context.repo;
            const tag = 'v2.1.1';
            const releases = await github.paginate(github.rest.repos.listReleases, {...repo, per_page: 100});
            let release = releases.find(item => item.tag_name === tag);
            if (release && !release.draft) throw new Error('Version 2.1.1 is already published; never replace published assets');
            const { loadReleaseNotes } = require('./scripts/release-notes.cjs');
            const body = loadReleaseNotes(tag);
            if (!release) release = (await github.rest.repos.createRelease({...repo, tag_name: tag, target_commitish: context.sha, name: 'Baran Download Manager 2.1.1 — Native Windows', body, draft: true, prerelease: false})).data;
            for (const name of fs.readdirSync('artifacts')) {
              const old = release.assets.find(asset => asset.name === name);
              if (old) await github.rest.repos.deleteReleaseAsset({...repo, asset_id: old.id});
              const data = fs.readFileSync(`artifacts/${name}`);
              const uploaded = (await github.rest.repos.uploadReleaseAsset({...repo, release_id: release.id, name, data})).data;
              if (uploaded.state !== 'uploaded' || uploaded.size !== data.length) throw new Error(`Incomplete asset ${name}`);
            }
            await github.rest.repos.updateRelease({...repo, release_id: release.id, body, draft: false, prerelease: false, make_latest: 'true', target_commitish: context.sha});
            core.notice(`Published ${tag}`);

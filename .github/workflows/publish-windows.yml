name: Publish Windows release

# Updating this explicitly named branch requests the 1.0.0 release.
# Ordinary development branches and main never publish a release.
on:
  push:
    branches: ['codex/release-v1.0.0']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: publish-windows-1.0.0
  cancel-in-progress: false

jobs:
  publish:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run typecheck
      - run: npm run test:network
      - run: npm run build
      - run: npx electron-builder --win --publish never
      - name: Package browser extension
        shell: pwsh
        run: ./scripts/package-extension.ps1
      - name: Verify files and generate checksums
        shell: pwsh
        run: |
          $version = (Get-Content package.json -Raw | ConvertFrom-Json).version
          if ($version -ne '1.0.0') { throw 'This release request only supports version 1.0.0' }
          $names = @("Baran-Download-Manager-Setup-$version-x64.exe", "Baran-Download-Manager-Portable-$version-x64.exe", "Baran-Browser-Extension-$version.zip")
          $lines = foreach ($name in $names) {
            $file = Get-Item -LiteralPath "dist/$name"
            if ($file.Length -eq 0) { throw "Empty release asset: $name" }
            $hash = (Get-FileHash -LiteralPath $file.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
            "$hash  $name"
          }
          $lines | Set-Content dist/SHA256SUMS.txt -Encoding utf8NoBOM
      - uses: actions/upload-artifact@v4
        with:
          name: baran-windows-1.0.0
          path: |
            dist/Baran-Download-Manager-Setup-*.exe
            dist/Baran-Download-Manager-Portable-*.exe
            dist/Baran-Browser-Extension-*.zip
            dist/SHA256SUMS.txt
          if-no-files-found: error
      - name: Publish verified release
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const fs = require('fs');
            const version = JSON.parse(fs.readFileSync('package.json', 'utf8')).version;
            const tag = `v${version}`;
            const { loadReleaseNotes } = require('./scripts/release-notes.cjs');
            const body = loadReleaseNotes(tag);
            const repo = context.repo;
            const releases = await github.paginate(github.rest.repos.listReleases, {...repo, per_page: 100});
            let release = releases.find(r => r.tag_name === tag);
            if (!release || !release.draft) throw new Error('Expected the prepared, unpublished 1.0.0 release draft');
            const names = [`Baran-Download-Manager-Setup-${version}-x64.exe`, `Baran-Download-Manager-Portable-${version}-x64.exe`, `Baran-Browser-Extension-${version}.zip`, 'SHA256SUMS.txt'];
            for (const name of names) {
              const old = release.assets.find(a => a.name === name);
              if (old) await github.rest.repos.deleteReleaseAsset({...repo, asset_id: old.id});
              await github.rest.repos.uploadReleaseAsset({...repo, release_id: release.id, name, data: fs.readFileSync(`dist/${name}`)});
            }
            const assets = (await github.rest.repos.listReleaseAssets({...repo, release_id: release.id})).data;
            for (const name of names) {
              const asset = assets.find(a => a.name === name && a.state === 'uploaded');
              if (!asset || asset.size !== fs.statSync(`dist/${name}`).size) throw new Error(`Incomplete asset: ${name}`);
            }
            try {
              const ref = await github.rest.git.getRef({...repo, ref: `tags/${tag}`});
              if (ref.data.object.sha !== context.sha) throw new Error('Release tag points at another commit');
            } catch (error) {
              if (error.status !== 404) throw error;
              await github.rest.git.createRef({...repo, ref: `refs/tags/${tag}`, sha: context.sha});
            }
            await github.rest.repos.updateRelease({...repo, release_id: release.id, body, target_commitish: context.sha, draft: false, prerelease: false, make_latest: 'true'});
            core.notice(`Published ${release.html_url}`);

name: Legacy Electron build

on:
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'

      - name: Install dependencies
        run: npm ci

      - name: Install Electron binary
        run: node node_modules/electron/install.js

      - name: Build app
        run: |
          npm test
          npm run typecheck
          npm run test:network
          npm run build

      - name: Package for Windows
        run: npx electron-builder --win --publish never

      - name: Verify Windows installer
        shell: pwsh
        run: |
          $setup = Get-ChildItem dist -Filter 'Baran-Download-Manager-Setup-*.exe' -ErrorAction SilentlyContinue
          if (-not $setup) { throw 'NSIS installer was not generated' }
          $setup | Select-Object Name, Length | Format-Table

      - name: Package browser extension
        shell: pwsh
        run: ./scripts/package-extension.ps1

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: baran-win
          path: |
            dist/Baran-Download-Manager-Setup-*.exe
            dist/Baran-Download-Manager-Setup-*.exe.blockmap
            dist/Baran-Download-Manager-Portable-*.exe
            dist/Baran-Browser-Extension-*.zip
          if-no-files-found: error

  build-linux:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'

      - name: Install dependencies
        run: npm ci

      - name: Install Electron binary
        run: node node_modules/electron/install.js

      - name: Build app
        run: |
          npm run typecheck
          npm run build

      - name: Package for Linux
        run: npx electron-builder --linux --publish never

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: baran-linux
          path: |
            dist/Baran-Download-Manager-*.AppImage
            dist/Baran-Download-Manager-*.deb
          if-no-files-found: error

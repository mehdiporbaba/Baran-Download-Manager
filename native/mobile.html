<!doctype html><html lang="fa" dir="rtl"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Baran · کنترل موبایل</title>
<style>body{margin:0;background:#08182a;color:#e8f3ff;font:16px system-ui;line-height:1.8}main{max-width:700px;margin:auto;padding:24px}h1{color:#69cfff}section,article{border:1px solid #25445d;border-radius:16px;padding:18px;margin:16px 0;background:#10283e}input,button{box-sizing:border-box;font:inherit;border:1px solid #3c718f;border-radius:10px;padding:10px;background:#14354c;color:inherit}input{width:100%;margin:8px 0;direction:ltr}button{cursor:pointer;background:#0966aa;margin:4px}small{color:#afc8da}#message{min-height:2em;color:#89d5ff}.row{display:flex;gap:8px;flex-wrap:wrap}h2{font-size:17px;overflow-wrap:anywhere}</style>
<main><h1>Baran Download Manager</h1><p>کنترل صف روی شبکهٔ محلی</p><section id="pair"><label>کد اتصال نمایش‌داده‌شده در برنامه<input id="token" type="password" autocomplete="off"></label><button id="connect">اتصال</button><p><small>فقط روی شبکهٔ خصوصی قابل اعتماد استفاده کن. ارتباط HTTP رمزگذاری نشده است. کد با توقف سرور باطل می‌شود.</small></p></section><div id="controls" hidden><section><label>افزودن لینک برای بررسی در لینک‌گیر<input id="url" type="url" placeholder="https://example.com/file.zip"></label><button id="collect">ارسال لینک</button><button id="refresh">تازه‌سازی</button><button id="disconnect">قطع اتصال</button></section><div id="tasks"></div></div><p id="message" role="status"></p></main>
<script>let token='';const $=id=>document.getElementById(id);async function api(path,body){const r=await fetch('/api/'+path,{method:body?'POST':'GET',headers:{Authorization:'Bearer '+token,...(body?{'Content-Type':'application/json'}:{})},...(body?{body:JSON.stringify(body)}:{})});if(!r.ok)throw Error('درخواست پذیرفته نشد؛ کد اتصال و وضعیت برنامه را بررسی کن.');return r.json()}async function run(fn){try{$('message').textContent='';await fn()}catch(e){$('message').textContent=e.message}}async function refresh(){const s=await api('status');$('tasks').replaceChildren();for(const t of s.tasks){const a=document.createElement('article'),h=document.createElement('h2'),p=document.createElement('p');h.textContent=t.name;p.textContent=t.status+' · '+Math.round(t.downloaded/1048576)+' / '+Math.round(t.size/1048576)+' MB';a.append(h,p);for(const action of ['pause','resume']){const b=document.createElement('button');b.textContent=action==='pause'?'توقف':'ادامه';b.onclick=()=>run(async()=>{await api('command',{action,id:t.id});await refresh()});a.append(b)}$('tasks').append(a)}}$('connect').onclick=()=>run(async()=>{token=$('token').value.trim();await refresh();$('token').value='';$('pair').hidden=true;$('controls').hidden=false});$('collect').onclick=()=>run(async()=>{await api('command',{action:'collect',url:$('url').value});$('url').value='';$('message').textContent='لینک برای بررسی به لینک‌گیر فرستاده شد.'});$('refresh').onclick=()=>run(refresh);$('disconnect').onclick=()=>{token='';$('tasks').replaceChildren();$('pair').hidden=false;$('controls').hidden=true};</script></html>
